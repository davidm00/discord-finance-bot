name: Paper Portfolio Backtest

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Download latest non-empty signal artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/restore_signal_artifact.sh

      - name: Replay historical portfolio
        run: python bot/paper_portfolio.py --backtest

      - name: Upload backtest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-portfolio-backtest-${{ github.run_number }}
          path: data/paper_portfolio/backtest/
          retention-days: 90
          if-no-files-found: error
