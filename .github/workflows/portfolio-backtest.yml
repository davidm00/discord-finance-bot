name: Paper Portfolio Backtest

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Download latest non-empty signal artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target=/tmp/latest-signals
          found=false

          while read -r run_id run_number; do
            artifact_name=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
              --jq '[.artifacts[] | select(.expired == false and (.name | startswith("signals-csv")) and .size_in_bytes > 10000)][0].name // empty')

            if [ -z "$artifact_name" ]; then
              continue
            fi

            rm -rf /tmp/latest-signals
            mkdir -p "$target"
            gh run download "$run_id" --name "$artifact_name" --dir "$target"
            if [ -s "$target/signals.csv" ]; then
              mkdir -p data
              cp "$target/signals.csv" data/signals.csv
              if [ -s "$target/signal_outcomes.csv" ]; then
                cp "$target/signal_outcomes.csv" data/signal_outcomes.csv
              fi
              echo "Using $artifact_name from workflow run $run_id (run number $run_number)"
              found=true
              break
            fi
          done < <(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/report.yml/runs?status=success&branch=main&per_page=50" \
              --jq '.workflow_runs[] | "\(.id) \(.run_number)"'
          )

          if [ "$found" != "true" ]; then
            echo "No non-empty signal artifact was found in the latest 50 successful report runs." >&2
            exit 1
          fi

      - name: Replay historical portfolio
        run: python bot/paper_portfolio.py --backtest

      - name: Upload backtest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-portfolio-backtest-${{ github.run_number }}
          path: data/paper_portfolio/backtest/
          retention-days: 90
          if-no-files-found: error
