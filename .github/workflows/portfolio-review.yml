name: Paper Portfolio Review

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      minimum_new_trades:
        description: "Minimum new closed trades required for strategy recommendations"
        required: false
        default: "10"

permissions:
  actions: read
  contents: write

concurrency:
  group: finance-report-shared-state
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Restore portfolio account
        uses: actions/cache/restore@v4
        with:
          path: data/paper_portfolio/forward/
          key: paper-portfolio-review-${{ github.run_id }}
          restore-keys: paper-portfolio-

      - name: Recover portfolio artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/restore_portfolio_artifact.sh

      - name: Recover durable data branch
        run: bash scripts/restore_data_branch.sh

      - name: Build recommend-only review
        id: build_review
        run: python bot/portfolio_review.py --minimum-new-trades "${{ github.event.inputs.minimum_new_trades || '10' }}"

      - name: Save review checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/paper_portfolio/forward/
          key: paper-portfolio-review-${{ github.run_id }}

      - name: Back up review checkpoint
        if: always() && steps.build_review.outcome == 'success'
        run: bash scripts/backup_data_branch.sh

      - name: Upload review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-portfolio-review-${{ github.run_number }}
          path: data/paper_portfolio/forward/reviews/
          retention-days: 90
          if-no-files-found: error
